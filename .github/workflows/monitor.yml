# Down Detector v1.1.1
name: Down Detector

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a TEST message to every configured channel (always sends, even in dry run)'
        type: boolean
        default: false
      probe:
        description: 'Print raw responses from each status source in the log'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: down-detector
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE: ${{ vars.LIVE }}
      PAGE_URL: ${{ vars.PAGE_URL }}
      INTERVAL_MINUTES: '5'
      # Teams is paused unless the TEAMS_ENABLED repo variable is 'true'
      TEAMS_WEBHOOK_URL: ${{ vars.TEAMS_ENABLED == 'true' && secrets.TEAMS_WEBHOOK_URL || '' }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
      PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
      M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
      M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
      M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
      HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Send test alert
        if: inputs.test_alert
        run: node src/monitor.mjs --test-alert

      - name: Restore state
        if: ${{ !inputs.test_alert }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: dd-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dd-state-

      - name: Run checks
        if: ${{ !inputs.test_alert }}
        run: node src/monitor.mjs ${{ inputs.probe && '--probe' || '' }}

      - name: Save state
        if: ${{ always() && !inputs.test_alert && hashFiles('state/state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: dd-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload status page
        if: ${{ always() && !inputs.test_alert && vars.PUBLISH_PAGE == 'true' && hashFiles('site/status.json') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-page:
    needs: check
    if: ${{ always() && !inputs.test_alert && vars.PUBLISH_PAGE == 'true' && needs.check.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
